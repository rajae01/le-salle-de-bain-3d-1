<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle de bain 3D</title>
<style>
:root{--bg:#1b1815;--fg:#2b2620;--panel:rgba(240,236,230,.94);--acc:#8b5a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#f0e9de;--panel:rgba(40,35,30,.92)}}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%}
.ui{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--fg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:760px;margin:0 auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;padding:7px 13px;border:1px solid rgba(128,128,128,.35);border-radius:16px;background:transparent;color:var(--fg);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{font-size:14px;display:flex;gap:5px;align-items:center;cursor:pointer}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.sw.on{border-color:var(--acc);background-clip:content-box}
.d{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;font-weight:600;background:rgba(255,255,255,.92);color:#222;padding:2px 6px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
 <div class="row" id="views"></div>
 <div class="row" id="lights"></div>
 <div class="row"><label><input type="checkbox" id="kC" checked>Plafond &amp; luminaires</label><label><input type="checkbox" id="kW" checked>Murs</label><label><input type="checkbox" id="kG" checked>Paroi en verre</label><label><input type="checkbox" id="kD">Cotes</label></div>
 <div class="row" id="fac"><span style="font-size:14px;color:var(--fg);opacity:.7">Façades</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
const W=2.6,D=2.2,H=2.2;
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0x35302a);
const cam=new THREE.PerspectiveCamera(42,1,.05,50);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;
const rnd=Math.random;
{const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.BoxGeometry(12,8,12),new THREE.MeshBasicMaterial({color:0xb8a58a,side:THREE.BackSide})));[[0,3.8,0,6,.1,6],[-5.8,1,0,.1,2,4],[5.8,1,0,.1,2,4]].forEach(([x,y,z,a,b,c])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,y,z);es.add(m)});S.environment=new THREE.PMREMGenerator(R).fromScene(es,.03).texture}
const slab=(base,rx,ry)=>tex(1024,1024,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<500;i++){g.fillStyle=`rgba(${rnd()<.5?'150,118,80':'255,250,242'},${rnd()*.05})`;g.beginPath();g.arc(rnd()*w,rnd()*h,rnd()*90+10,0,7);g.fill()}for(let i=0;i<9;i++){g.strokeStyle=`rgba(150,120,85,${.1+rnd()*.18})`;g.lineWidth=1+rnd()*3;g.beginPath();let x=rnd()*w,y=0;g.moveTo(x,y);for(let k=0;k<8;k++){x+=rnd()*160-80;y+=h/8;g.lineTo(x,y)}g.stroke()}g.strokeStyle='rgba(140,115,85,.55)';g.lineWidth=3;g.strokeRect(0,0,w,h)},rx,ry);
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const tileTex=(base,rx,ry,line)=>tex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(${rnd()<.5?'140,105,70':'255,250,240'},${rnd()*.06})`;g.beginPath();g.arc(rnd()*w,rnd()*h,rnd()*40+5,0,7);g.fill()}g.strokeStyle=line;g.lineWidth=4;g.strokeRect(0,0,w,h)},rx,ry);
const woodTex=tex(512,512,(g,w,h)=>{g.fillStyle='#b98a58';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.strokeStyle=`rgba(${rnd()<.5?'90,55,25':'230,190,140'},${rnd()*.22})`;g.lineWidth=rnd()*3+.4;const y=rnd()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+rnd()*8-4,w*.6,y+rnd()*8-4,w,y+rnd()*6-3);g.stroke()}},1,1);
const fm=()=>new THREE.MeshStandardMaterial({map:woodTex,roughness:.55});
const FAC=[fm(),fm(),fm()]; // façades, carcasse, niche
const M={white:new THREE.MeshStandardMaterial({color:0xf7f6f2,roughness:.18}),chrome:new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.12}),black:new THREE.MeshStandardMaterial({color:0x151515,roughness:.4,metalness:.5}),
 glass:new THREE.MeshPhysicalMaterial({color:0xcfe8ee,transparent:true,opacity:.22,roughness:.02,side:THREE.DoubleSide})};
function box(w,h,d,mat,x,y,z,g){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=!!(mat.map||mat===M.white);m.receiveShadow=true;(g||S).add(m);return m}
function cyl(r1,r2,h,mat,x,y,z,rx,g){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,28),mat);m.position.set(x,y,z);if(rx)m.rotation.x=Math.PI/2;m.castShadow=true;(g||S).add(m);return m}

// sol, murs
const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:slab('#d9c8a6',W/.6,D/1.2),roughness:.16}));fl.rotation.x=-Math.PI/2;fl.position.set(W/2,0,D/2);fl.receiveShadow=true;S.add(fl);
const walls=new THREE.Group();S.add(walls);
const wmat=(n)=>new THREE.MeshStandardMaterial({map:slab('#e1d0b2',n/.6,H/1.2),roughness:.22});
[[1.85,[.925,H/2,0],0],[W-1.85,[(1.85+W)/2,H/2,.1],0],[.1,[1.85,H/2,.05],-Math.PI/2],[D,[0,H/2,D/2],Math.PI/2],[D,[W,H/2,D/2],-Math.PI/2],[W,[W/2,H/2,D],Math.PI]].forEach(([n,p,r],i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(n,H),wmat(n));m.position.set(...p);m.rotation.y=r;m.receiveShadow=true;(i<5?walls:S).add(m)});
{const pm=new THREE.MeshStandardMaterial({color:0xf1ece2});box(1.85,.1,.02,pm,.925,.05,.01,walls);box(W-1.85,.1,.02,pm,(1.85+W)/2,.05,.11,walls);
}

// plafond et spots
const ceil=new THREE.Group();S.add(ceil);
const cp=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0xf4f1ea,roughness:.9}));cp.rotation.x=Math.PI/2;cp.position.set(W/2,H,D/2);ceil.add(cp);

[[.5,.7],[1.4,.8],[2.0,.8],[1.0,1.6]].forEach(([x,z])=>{const s=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.01,24),new THREE.MeshBasicMaterial({color:0xfff2d6}));s.position.set(x,H-.005,z);ceil.add(s)});

// douche
box(.95,.035,1.2,M.white,.475,.0175,.6);cyl(.04,.04,.005,M.chrome,.475,.037,.6);
const glass=new THREE.Group();S.add(glass);
box(.02,2,1.2,M.glass,.95,1,.6,glass);box(.025,2,.025,M.black,.95,1,1.2,glass);box(.025,2,.025,M.black,.95,1,.0125,glass);box(.025,.025,1.2,M.black,.95,2,.6,glass);
cyl(.012,.012,.4,M.black,.45,2.0,.2,true);cyl(.13,.13,.02,M.black,.45,1.98,.4);cyl(.012,.012,.9,M.black,.12,1.2,.02);
const flute=tex(256,256,(g,w,h)=>{g.fillStyle='#a87a4c';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=16){const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'rgba(60,35,15,.45)');gr.addColorStop(.5,'rgba(255,220,170,.18)');gr.addColorStop(1,'rgba(60,35,15,.5)');g.fillStyle=gr;g.fillRect(x,0,16,h)}},3,1);
const fp=new THREE.Mesh(new THREE.PlaneGeometry(.95,H),new THREE.MeshStandardMaterial({map:flute,roughness:.5}));fp.position.set(.475,H/2,.004);fp.receiveShadow=true;S.add(fp);
const led=new THREE.MeshBasicMaterial({color:0xffd7a0});
const nc=new THREE.Mesh(new THREE.PlaneGeometry(.5,.3),new THREE.MeshStandardMaterial({color:0xcdb592,roughness:.6}));nc.position.set(.475,1.15,.01);S.add(nc);
box(.5,.012,.012,led,.475,1.29,.014);box(.012,.3,.012,led,.225,1.15,.014);box(.012,.3,.012,led,.725,1.15,.014);
cyl(.02,.02,.14,M.white,.38,1.07,.05);cyl(.017,.017,.1,M.black,.46,1.05,.05);
const nl=new THREE.PointLight(0xffc880,.4,1.2);nl.position.set(.475,1.25,.12);S.add(nl);

// meuble vasque 79,5 x 49,5 x 50, suspendu
const vx=1.05,vw=.795,vd=.495,vy=.30,vh=.50,vcx=vx+vw/2,vz=vd/2,t=.02;
box(vw,t,vd,FAC[2],vcx,vy+t/2,vz);box(vw-2*t,t,vd,FAC[1],vcx,vy+vh-.03-.225,vz);
box(t,vh-.03,vd,FAC[1],vx+t/2,vy+(vh-.03)/2,vz);box(t,vh-.03,vd,FAC[1],vx+vw-t/2,vy+(vh-.03)/2,vz);
box(vw,vh-.03,.01,FAC[2],vcx,vy+(vh-.03)/2,.005);
const ctp=new THREE.Shape();ctp.moveTo(-vw/2,-(vd+.01)/2);ctp.lineTo(vw/2,-(vd+.01)/2);ctp.lineTo(vw/2,(vd+.01)/2);ctp.lineTo(-vw/2,(vd+.01)/2);ctp.closePath();
const hole=new THREE.Path();hole.absellipse(0,-.015,.21,.17,0,Math.PI*2,true);ctp.holes.push(hole);
const tm=new THREE.Mesh(new THREE.ExtrudeGeometry(ctp,{depth:.03,bevelEnabled:false,curveSegments:48}),M.white);tm.rotation.x=-Math.PI/2;tm.position.set(vcx,vy+vh-.03,vz+.005);tm.castShadow=tm.receiveShadow=true;S.add(tm);
box(vw-.02,.2,.02,FAC[0],vcx,vy+vh-.03-.115,vd-.01);box(.3,.012,.012,M.black,vcx,vy+vh-.075,vd+.005);
const tw=new THREE.MeshStandardMaterial({color:0xf2ece2,roughness:1});
box(.32,.05,.34,tw,vx+.22,vy+.045,vz-.03);box(.3,.05,.34,new THREE.MeshStandardMaterial({color:0xd9d1c3,roughness:1}),vx+.22,vy+.095,vz-.03);
[0,1,2].forEach(i=>cyl(.04,.04,.34,tw,vx+.5+i*.09,vy+.06,vz-.03,true).rotation.z=0);
const bowlM=new THREE.MeshStandardMaterial({color:0xf3f2ee,roughness:.12,side:THREE.DoubleSide});
const prof=[[.001,-.085],[.18,-.085],[.5,-.08],[.78,-.062],[.93,-.03],[1,0]].map(([r,y])=>new THREE.Vector2(r,y));
const bowl=new THREE.Mesh(new THREE.LatheGeometry(prof,64),bowlM);bowl.scale.set(.21,1,.17);bowl.position.set(vcx,vy+vh,vz+.02);bowl.receiveShadow=true;S.add(bowl);
cyl(.028,.028,.004,M.chrome,vcx,vy+vh-.082,vz+.02);
const fy=vy+vh,fz=.085;
cyl(.026,.03,.02,M.chrome,vcx,fy+.01,fz);cyl(.014,.016,.12,M.chrome,vcx,fy+.08,fz);
const sp=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(vcx,fy+.12,fz),new THREE.Vector3(vcx,fy+.165,fz+.01),new THREE.Vector3(vcx,fy+.18,fz+.06),new THREE.Vector3(vcx,fy+.172,fz+.115),new THREE.Vector3(vcx,fy+.155,fz+.125)]),32,.009,12),M.chrome);sp.castShadow=true;S.add(sp);
box(.05,.01,.012,M.chrome,vcx+.03,fy+.1,fz);
cyl(.03,.03,.14,new THREE.MeshStandardMaterial({color:0xefe6d6,roughness:.3}),vx+vw-.08,vy+vh+.07,.12);
{const px=vx+.1,pz=.12,pm=new THREE.MeshStandardMaterial({color:0xe9e2d4,roughness:.5}),lm=new THREE.MeshStandardMaterial({color:0x4a6b3a,roughness:.7});cyl(.035,.03,.07,pm,px,fy+.035,pz);for(let i=0;i<14;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.03,10,8),lm);l.scale.set(.5,1.6,.2);const a=i/14*6.28;l.position.set(px+Math.cos(a)*.03,fy+.13+(i%3)*.03,pz+Math.sin(a)*.03);l.rotation.set(Math.sin(a)*.6,a,Math.cos(a)*.6);l.castShadow=true;S.add(l)}}

// colonne 60 cm : 2 portes en bas, 2 en haut, jusqu'au plafond
const cx=vx+vw+.005,cw=.6,cd=.38,cy=.30,ch=H-cy,ccx=cx+cw/2,gap=.004,dw=cw/2-gap*1.5,split=.78;
const colG=new THREE.Group();colG.position.z=.1;S.add(colG);box(cw,ch,cd-.02,FAC[1],ccx,cy+ch/2,(cd-.02)/2,colG);
[[cy,split-gap],[cy+split+gap/2,ch-split-gap/2-.003]].forEach(([y0,dh],r)=>[0,1].forEach(i=>{const x=cx+gap+dw/2+i*(dw+gap);
 box(dw,dh-gap,.02,FAC[0],x,y0+dh/2,cd-.01,colG);
 box(.012,.22,.012,M.black,x+(i?-dw/2+.03:dw/2-.03),r?y0+.15:y0+dh-.15,cd+.012,colG)}));
// espace caché 15 cm entre colonne et mur (porte pleine hauteur)
const hx=cx+cw+.0,hw=W-hx;
box(hw-.004,ch,.02,FAC[0],hx+hw/2,cy+ch/2,cd-.01,colG);

const gl=new THREE.MeshBasicMaterial({color:0xffd9a0});box(1.85,.02,.04,gl,.925,H-.03,.03);box(hw,.02,.04,gl,hx+hw/2,H-.03,.13);box(vw,.006,.03,gl,vcx,vy-.003,vd-.05);box(cw,.006,.03,gl,cx+cw/2,cy-.003,cd-.05,colG);

// miroir rétroéclairé
const rr=(w,h,r)=>{const s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return new THREE.ShapeGeometry(s,12)};
const mx=vcx,my=1.3,halo=new THREE.Mesh(rr(.56,.71,.08),new THREE.MeshBasicMaterial({color:0xffe0ae}));halo.position.set(mx,my,.012);S.add(halo);
const mir=new THREE.Reflector(rr(.5,.65,.06),{color:0xc8c8c8,textureWidth:1024,textureHeight:1024,clipBias:.003});mir.position.set(mx,my,.016);S.add(mir);
box(.9,.012,.5,new THREE.MeshStandardMaterial({color:0xcbb79b,roughness:1}),1.45,.006,.95);

// lumières
const hemi=new THREE.HemisphereLight(0xfff3e0,0x8a7760,.5);S.add(hemi);
const dl=new THREE.PointLight(0xfff0d8,.9,6);dl.position.set(1.3,2.05,1.2);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);dl.shadow.bias=-.0008;S.add(dl);
const dl2=new THREE.PointLight(0xffe6c0,.4,4);dl2.position.set(.5,2.0,.7);S.add(dl2);
const ml=new THREE.PointLight(0xffc880,.7,2.2);ml.position.set(mx,my,.25);S.add(ml);
[[vcx,.22,.5],[2.15,.22,.55]].forEach(([x,y,z])=>{const l=new THREE.PointLight(0xffb86a,.35,1.3);l.position.set(x,y,z);S.add(l)});
const LP={'Chaleureuse':[.5,0xfff3e0,.9,0xfff0d8,.7,1.15,0xffe0ae],'Plein jour':[.95,0xffffff,1.3,0xf2f7ff,.2,1.3,0xffffff],'Soir':[.12,0xffd9a8,.3,0xffc880,1.6,.8,0xffcf8a]};
function light(n,b){const p=LP[n];hemi.intensity=p[0]*.55;hemi.color.set(p[1]);dl.intensity=p[2];dl.color.set(p[3]);dl2.intensity=p[2]*.45;ml.intensity=p[4];R.toneMappingExposure=p[5];halo.material.color.set(p[6]);[...document.querySelectorAll('#lights button')].forEach(x=>x.classList.toggle('on',x.textContent===n))}

// vues
const V={"Vue d’ensemble":[[2.3,1.5,4.7],[1.2,1.0,.4]],"Vue frontale":[[1.3,1.15,5.2],[1.3,1.0,.3]],"Douche":[[.55,1.4,3.3],[.5,1.0,.3]],"Vasque":[[1.45,1.2,2.3],[1.45,.95,.2]],"Colonne":[[2.1,1.2,2.8],[2.1,1.1,.2]],"Plan":[[1.3,5.2,1.5],[1.3,0,1.1]]};
function go(k){cam.position.set(...V[k][0]);ctl.target.set(...V[k][1]);ctl.update();[...document.querySelectorAll('#views button')].forEach(x=>x.classList.toggle('on',x.textContent===k))}
Object.keys(V).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>go(k);views.appendChild(b)});
Object.keys(LP).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>light(k);lights.appendChild(b)});
// façades
const FC=[['Chêne',null],['Sable',0xe3d2ab],['Blanc',0xf1efe8],['Anthracite',0x3a3f44],['Sauge',0x8fa593],['Bleu nuit',0x24405e]];
FC.forEach(([n,c],i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.title=n;b.style.background=c===null?'#b98a58':'#'+c.toString(16).padStart(6,'0');b.onclick=()=>{FAC.forEach((m,j)=>{m.map=c===null?woodTex:null;m.color.set(c===null?0xffffff:j==2?c:c);m.needsUpdate=true});[...fac.querySelectorAll('.sw')].forEach(x=>x.classList.toggle('on',x===b))};fac.appendChild(b)});
kC.onchange=()=>ceil.visible=kC.checked;kW.onchange=()=>walls.visible=kW.checked;kG.onchange=()=>glass.visible=kG.checked;
// cotes
const DIMS=[['79,5 cm',[vcx,.22,vd+.06]],['60 cm',[ccx,.07,cd+.16]],['15 cm',[hx+hw/2,.07,cd+.16]],['Hauteur 2,20 m',[.06,1.1,1.9]],['Colonne 1,90 m',[ccx,1.1,cd+.16]]].map(([s,p])=>{const e=document.createElement('div');e.className='d';e.textContent=s;e.style.display='none';document.body.appendChild(e);return[e,new THREE.Vector3(...p)]});
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:42;cam.updateProjectionMatrix()}
S.traverse(o=>{if(o.material&&o.material.isMeshStandardMaterial)o.material.envMapIntensity=.4});M.chrome.envMapIntensity=1.3;
addEventListener('resize',rs);rs();go('Vue d’ensemble');light('Chaleureuse');
(function a(){requestAnimationFrame(a);ctl.update();R.render(S,cam);DIMS.forEach(([e,p])=>{if(!kD.checked){e.style.display='none';return}const v=p.clone().project(cam);e.style.display=v.z<1?'block':'none';e.style.transform=`translate(${(v.x+1)/2*innerWidth}px,${(1-v.y)/2*innerHeight}px) translate(-50%,-50%)`})})();
</script>
</body>
</html>
